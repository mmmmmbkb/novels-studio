name: Extract novels-studio v2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract v2 zip over repo
        run: |
          set -e
          unzip -l novels-studio-v2.zip
          rm -rf /tmp/v2 && mkdir -p /tmp/v2
          unzip -o novels-studio-v2.zip -d /tmp/v2
          echo '--- extracted tree ---'
          find /tmp/v2 -maxdepth 3 | sort
          COUNT=$(ls -1 /tmp/v2 | wc -l)
          FIRST=$(ls -1 /tmp/v2 | head -n 1)
          if [ "$COUNT" = "1" ] && [ -d "/tmp/v2/$FIRST" ]; then
            SRC="/tmp/v2/$FIRST"
          else
            SRC="/tmp/v2"
          fi
          echo "SRC=$SRC"
          git ls-files -z | xargs -0 rm -f -- || true
          rm -rf extension public src supabase
          cp -a "$SRC"/. .
          rm -f novels-studio-v2.zip
          echo '--- new tree ---'
          ls -la
          git status --short
          git add -A
          git -c user.name="mmmmmbkb" -c user.email="mmmmmbkb@users.noreply.github.com" commit -m "Replace contents with novels-studio v2"
          git push
