name: Extract v3
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract novels-studio-v3.zip over repo root
        run: |
          set -e
          unzip -l novels-studio-v3.zip
          rm -rf /tmp/v3
          mkdir -p /tmp/v3
          unzip -o novels-studio-v3.zip -d /tmp/v3
          TOP_COUNT=$(find /tmp/v3 -mindepth 1 -maxdepth 1 | wc -l)
          TOP_DIR=$(find /tmp/v3 -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ "$TOP_COUNT" -eq 1 ] && [ -n "$TOP_DIR" ]; then SRC="$TOP_DIR"; else SRC="/tmp/v3"; fi
          echo "Extract source: $SRC"
          cp -a "$SRC"/. .
          rm -f novels-studio-v3.zip
          rm -f .github/workflows/extract-v3.yml
          git status --short
      - name: Commit extracted v3 files
        run: |
          git config user.name "mmmmmbkb"
          git config user.email "mmmmmbkb@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --quiet || git commit -m "Replace contents with novels-studio v3 (gold theme, no purple)"
          git push
