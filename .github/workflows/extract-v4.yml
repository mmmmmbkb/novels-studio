name: Extract v4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract v4 zip over repo root
        run: |
          set -e
          unzip -o novels-studio-v4.zip -d /tmp/v4extract
          rm -rf /tmp/v4extract/__MACOSX
          find /tmp/v4extract -name '.DS_Store' -delete || true
          SRC=/tmp/v4extract
          if [ "$(ls -1 "$SRC" | wc -l)" -eq 1 ] && [ -d "$SRC/$(ls -1 "$SRC")" ]; then
            SRC="$SRC/$(ls -1 "$SRC")"
          fi
          echo "Source: $SRC"
          ls -la "$SRC"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'novels-studio-v4.zip' ! -name '.github' -exec rm -rf {} +
          cp -a "$SRC"/. .
          rm -f novels-studio-v4.zip
          rm -f *.zip
          git config user.name "mmmmmbkb"
          git config user.email "mmmmmbkb@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Replace contents with novels-studio v4 (admin notification badge)" || echo "No changes to commit"
          git push
