name: Extract v5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract novels-studio-v5.zip over repository root
        run: |
          unzip -o novels-studio-v5.zip -d /tmp/v5
          SRC=$(find /tmp/v5 -mindepth 1 -maxdepth 1 -type d | head -n 1)
          echo "Source dir: $SRC"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'novels-studio-v5.zip' ! -name '.github' -exec rm -rf {} +
          cp -a "$SRC"/. .
          rm -f novels-studio-v5.zip
          rm -rf .github/workflows/extract-v5.yml
          git status --short

      - name: Commit and push
        run: |
          git config user.name "mmmmmbkb"
          git config user.email "mmmmmbkb@users.noreply.github.com"
          git add -A
          git commit -m "Replace contents with novels-studio v5" || echo "Nothing to commit"
          git push
