name: Extract project zip
on:
  workflow_dispatch:
  push:
    paths:
      - novels-studio.zip
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project files
        run: |
          unzip -o novels-studio.zip
          rm -f novels-studio.zip
          shopt -s dotglob nullglob
          dirs=(*/)
          if [ "${#dirs[@]}" -eq 1 ] && [ -f "${dirs[0]}package.json" ]; then
            mv "${dirs[0]}"* ./
            rmdir "${dirs[0]}"
          fi
          rm -rf .github
          ls -la
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract novels-studio project files" || echo "nothing to commit"
          git push
