name: Flatten project to root
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move project files to root
        run: |
          proj=$(dirname "$(find . -name package.json -not -path './.git/*' | head -n 1)")
          echo "project dir: $proj"
          if [ -z "$proj" ] || [ "$proj" = "." ]; then echo "package.json already at root"; exit 0; fi
          shopt -s dotglob nullglob
          mv "$proj"/* ./
          rm -rf novels-studio
          rm -rf .github
          ls -la
      - name: Commit flattened files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move project files to repository root" || echo "nothing to commit"
          git push
